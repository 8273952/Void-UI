<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Void web</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000000;
            min-height: 100vh;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            gap: 30px;
        }

        h1 {
            font-family: Arial, sans-serif;
            margin-top: 0;
            font-size: 60px;
            text-align: center;
            background: rgba(0, 0, 0, 0.05);
            padding: 20px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }

        .textbox {
            background: rgba(255, 255, 255, 0.1);
            text-decoration: none;
            text-align: center;
            border: 2px solid rgba(255, 255, 255, 0.3);
            padding: 15px;
            border-radius: 10px;
            color: white;
            font-family: Arial, sans-serif;
            font-weight: bold;
            font-size: 16px;
            width: 300px;
            max-width: 90%;
            backdrop-filter: blur(10px);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .textbox:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.1);
        }

        .textbox:active {
            background: rgba(255, 255, 255, 0.12);
            transform: scale(0.98);
        }

        .textbox:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.6);
            background: rgba(255, 255, 255, 0.15);
        }

        .button-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 700px;
        }
    </style>
</head> 
<body>
    <canvas id="bubbleCanvas"></canvas>
    
    <div class="content">
        <h1>Void Web<br><span style="font-size: 24px;"></span></h1>
        <div class="button-container">
            <a class="textbox" href="https://your-site.com/page1" target="_blank">Games</a>
            <a class="textbox" href="https://your-site.com/page2" target="_blank">Entertainment</a>

            <button class="textbox" onclick="loadGame('https://your-file-url.xml')"></button>
        </div>
    </div>
  
    <script>
        const canvas = document.getElementById('bubbleCanvas');
        const ctx = canvas.getContext('2d');

        // Set canvas size
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
      
        // Function used to load file urls in a about:blank tab
        function loadGame(gameUrl) {
    const newWindow = window.open("", "_blank");
    if (newWindow) {
        fetch(gameUrl)
            .then(response => response.text())
            .then(content => {
                newWindow.document.open();
                newWindow.document.write(content);
                newWindow.document.close();
            })
            .catch(err => alert('Failed to load game'));
    } else {
        alert('Pop-up blocked. Allow pop-ups to play.');
    }
}

        // Bubble class
        class Bubble {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.radius = Math.random() * 20 + 5; // 5-25px
                this.speedX = (Math.random() - 0.5) * 0.5;
                this.speedY = (Math.random() - 0.5) * 0.5;
                this.opacity = Math.random() * 0.3 + 0.7; // 0.7-1.0
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                // Bounce off edges
                if (this.x - this.radius < 0 || this.x + this.radius > canvas.width) {
                    this.speedX *= -1;
                    this.x = Math.max(this.radius, Math.min(canvas.width - this.radius, this.x));
                }
                if (this.y - this.radius < 0 || this.y + this.radius > canvas.height) {
                    this.speedY *= -1;
                    this.y = Math.max(this.radius, Math.min(canvas.height - this.radius, this.y));
                }
            }

            draw() {
                // Glow effect
                const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius * 1.5);
                gradient.addColorStop(0, `rgba(255, 255, 255, ${this.opacity * 0.6})`);
                gradient.addColorStop(0.7, `rgba(255, 255, 255, ${this.opacity * 0.2})`);
                gradient.addColorStop(1, `rgba(255, 255, 255, 0)`);
                
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius * 1.5, 0, Math.PI * 2);
                ctx.fill();
                
                // Main bubble
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.fill();
                ctx.strokeStyle = `rgba(255, 255, 255, ${this.opacity * 0.8})`;
                ctx.lineWidth = 1.5;
                ctx.stroke();
                
                // Shine highlight
                const shineGradient = ctx.createRadialGradient(
                    this.x - this.radius * 0.3, 
                    this.y - this.radius * 0.3, 
                    0, 
                    this.x - this.radius * 0.3, 
                    this.y - this.radius * 0.3, 
                    this.radius * 0.5
                );
                shineGradient.addColorStop(0, `rgba(255, 255, 255, ${this.opacity * 0.8})`);
                shineGradient.addColorStop(1, `rgba(255, 255, 255, 0)`);
                
                ctx.fillStyle = shineGradient;
                ctx.beginPath();
                ctx.arc(this.x - this.radius * 0.3, this.y - this.radius * 0.3, this.radius * 0.5, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Star class
        class Star {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.radius = Math.random() * 1.5;
                this.opacity = Math.random() * 0.7 + 0.3;
                this.twinkleSpeed = Math.random() * 0.02 + 0.005;
                this.twinkleDirection = Math.random() > 0.5 ? 1 : -1;
            }

            update() {
                this.opacity += this.twinkleSpeed * this.twinkleDirection;
                if (this.opacity > 0.9) {
                    this.twinkleDirection = -1;
                } else if (this.opacity < 0.2) {
                    this.twinkleDirection = 1;
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.fill();
            }
        }

        // Particle class for ambient dust
        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.radius = Math.random() * 0.8;
                this.speedX = (Math.random() - 0.5) * 0.1;
                this.speedY = (Math.random() - 0.5) * 0.1;
                this.opacity = Math.random() * 0.3 + 0.05;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                // Wrap around edges
                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height;
                if (this.y > canvas.height) this.y = 0;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.fill();
            }
        }

        // Create bubbles
        const bubbles = [];
        const bubbleCount = 50; // Amount of bubbles

        for (let i = 0; i < bubbleCount; i++) {
            bubbles.push(new Bubble());
        }

        // Create stars
        const stars = [];
        const starCount = 200; // Amount of stars

        for (let i = 0; i < starCount; i++) {
            stars.push(new Star());
        }

        // Create ambient particles
        const particles = [];
        const particleCount = 150; // Amount of particles

        for (let i = 0; i < particleCount; i++) {
            particles.push(new Particle());
        }

        // Animation time tracker
        let animationTime = 0;

        // Animation loop
        function animate() {
            animationTime++;
            
            // Clear canvas completely
            ctx.fillStyle = 'rgba(0, 0, 0, 1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw and update stars
            stars.forEach(star => {
                star.update();
                star.draw();
            });

            // Draw and update particles
            particles.forEach(particle => {
                particle.update();
                particle.draw();
            });

            // Draw connecting lines between nearby bubbles
            for (let i = 0; i < bubbles.length; i++) {
                for (let j = i + 1; j < bubbles.length; j++) {
                    const dx = bubbles[i].x - bubbles[j].x;
                    const dy = bubbles[i].y - bubbles[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < 150) {
                        const opacity = 0.6 * (1 - distance / 150);
                        
                        // Pulsing shine effect
                        const pulse = Math.sin(animationTime * 0.003 + i + j) * 0.3 + 0.7;
                        const shineOpacity = opacity * pulse;
                        
                        // Glow line with shine
                        ctx.strokeStyle = `rgba(255, 255, 255, ${shineOpacity * 0.4})`;
                        ctx.lineWidth = 3;
                        ctx.beginPath();
                        ctx.moveTo(bubbles[i].x, bubbles[i].y);
                        ctx.lineTo(bubbles[j].x, bubbles[j].y);
                        ctx.stroke();
                        
                        // Main line with shine
                        ctx.strokeStyle = `rgba(255, 255, 255, ${shineOpacity})`;
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(bubbles[i].x, bubbles[i].y);
                        ctx.lineTo(bubbles[j].x, bubbles[j].y);
                        ctx.stroke();
                    }
                }
            }

            // Update and draw bubbles
            bubbles.forEach(bubble => {
                bubble.update();
                bubble.draw();
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
